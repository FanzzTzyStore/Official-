<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanzzTzyStore - Top Up Game & PPOB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/40?text=FT'">
            <span class="logo-text">FanzzTzy<span>Store</span></span>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cari Game, Pulsa, E-Wallet..." onkeyup="filterProducts()">
        </div>
    </header>

    <!-- Banner Section -->
    <section class="banner-section">
        <div class="banner-slider">
            <img src="assets/banner/banner1.jpg" class="banner-item active" alt="Banner 1" onerror="this.src='https://via.placeholder.com/800x300/1e1b4b/ffffff?text=Promo+Spesial+Top+Up'">
            <img src="assets/banner/banner2.jpg" class="banner-item" alt="Banner 2" onerror="this.src='https://via.placeholder.com/800x300/311042/ffffff?text=Proses+Kilat+24+Jam'">
            <img src="assets/banner/banner3.jpg" class="banner-item" alt="Banner 3" onerror="this.src='https://via.placeholder.com/800x300/0f172a/ffffff?text=Harga+Termurah'">
        </div>
    </section>

    <!-- Category Filter -->
    <section class="category-section">
        <button class="cat-btn active" onclick="filterCategory('all', this)"><i class="fas fa-border-all"></i> Semua</button>
        <button class="cat-btn" onclick="filterCategory('game', this)"><i class="fas fa-gamepad"></i> Game</button>
        <button class="cat-btn" onclick="filterCategory('pulsa', this)"><i class="fas fa-mobile-alt"></i> Pulsa</button>
        <button class="cat-btn" onclick="filterCategory('ewallet', this)"><i class="fas fa-wallet"></i> E-Wallet</button>
        <button class="cat-btn" onclick="filterCategory('voucher', this)"><i class="fas fa-ticket-alt"></i> Voucher</button>
    </section>

    <!-- Product Grid Section -->
    <main class="container">
        <h2 class="section-title">Pilih Produk</h2>
        <div class="product-grid" id="productGrid">
            <!-- Item produk diisi via JavaScript -->
        </div>
    </main>

    <!-- Modal Form Top Up -->
    <div class="modal-overlay" id="topupModal">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Product">
                <div>
                    <h3 id="modalTitle">Nama Produk</h3>
                    <p id="modalCategory" class="badge">Kategori</p>
                </div>
            </div>
            
            <form id="topupForm" onsubmit="submitOrder(event)">
                <!-- Step 1: Input ID / Nomor -->
                <div class="form-group">
                    <label id="labelInputTarget">ID User / Nomor HP:</label>
                    <input type="text" id="targetInput" placeholder="Masukkan ID / Nomor" required>
                </div>

                <!-- Step 2: Pilih Nominal -->
                <div class="form-group">
                    <label>Pilih Nominal Top Up:</label>
                    <div class="items-grid" id="nominalGrid">
                        <!-- Nominal diisi via JS -->
                    </div>
                </div>

                <!-- Step 3: Pilih Pembayaran -->
                <div class="form-group">
                    <label>Metode Pembayaran:</label>
                    <div class="payment-grid">
                        <label class="pay-card">
                            <input type="radio" name="payment" value="qris" required>
                            <span>QRIS</span>
                        </label>
                        <label class="pay-card">
                            <input type="radio" name="payment" value="dana">
                            <span>DANA</span>
                        </label>
                        <label class="pay-card">
                            <input type="radio" name="payment" value="bca">
                            <span>BCA</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn"><i class="fab fa-whatsapp"></i> Beli Sekarang Via WA</button>
            </form>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/6289618602130" target="_blank" class="floating-wa" title="Hubungi kami di WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Created by <strong>FanzzTzyStore</strong>. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
          </html>
