<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FanzzTzyStore - Top Up Game & PPOB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>

  <!-- HEADER BRAND -->
  <header>
    <div class="brand-container">
      <img src="assets/logo.png" alt="FanzzTzyStore Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-title">FanzzTzy<span>Store</span></div>
    </div>
  </header>

  <div class="container">

    <!-- BANNER PROMO CAROUSEL -->
    <div class="banner-container">
      <div class="banner-slide active">
        <img src="assets/banner/banner1.jpg" alt="Banner 1" onerror="this.src='https://via.placeholder.com/600x200/1a1d29/ff0055?text=PROMO+TOP+UP+GAME'">
      </div>
      <div class="banner-slide">
        <img src="assets/banner/banner2.jpg" alt="Banner 2" onerror="this.src='https://via.placeholder.com/600x200/1a1d29/ff0055?text=LAYANAN+PULSA+%26+DATA'">
      </div>
      <div class="banner-slide">
        <img src="assets/banner/banner3.jpg" alt="Banner 3" onerror="this.src='https://via.placeholder.com/600x200/1a1d29/ff0055?text=ISU+E-WALLET+%26+VOUCHER'">
      </div>

      <button class="banner-btn prev" onclick="moveSlide(-1)">&#10094;</button>
      <button class="banner-btn next" onclick="moveSlide(1)">&#10095;</button>

      <div class="banner-dots">
        <span class="dot active" onclick="setSlide(0)"></span>
        <span class="dot" onclick="setSlide(1)"></span>
        <span class="dot" onclick="setSlide(2)"></span>
      </div>
    </div>

    <!-- SEARCH INPUT -->
    <div class="search-box">
      <span class="search-icon">&#128091;</span>
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Cari Game, Pulsa, E-Wallet, Voucher...">
    </div>

    <!-- CATEGORY FILTER BUTTONS -->
    <div class="category-scroll">
      <button class="cat-btn active" onclick="filterCategory('semua', this)">&#8862; Semua</button>
      <button class="cat-btn" onclick="filterCategory('game', this)">&#127918; Game</button>
      <button class="cat-btn" onclick="filterCategory('pulsa', this)">&#128241; Pulsa</button>
      <button class="cat-btn" onclick="filterCategory('ewallet', this)">&#128588; E-Wallet</button>
      <button class="cat-btn" onclick="filterCategory('voucher', this)">&#127915; Voucher</button>
    </div>

    <!-- PRODUCT LIST CONTAINER -->
    <div class="product-grid" id="productGrid"></div>

    <!-- FOOTER -->
    <footer>
      &copy; 2026 <b>FanzzTzyStore</b>. Created with <span>&#10084;</span> by AI Assistant.
    </footer>

  </div>

  <!-- FLOATING WHATSAPP BUTTON -->
  <a href="https://wa.me/6289618602130?text=Halo%20FanzzTzyStore,%20saya%20ingin%20topup" class="wa-floating" target="_blank" title="Hubungi via WhatsApp">

    </svg>
  </a>

  <script src="script.js"></script>
</body>
            </html>
